schema_version: 1
timezone: Asia/Shanghai
run_time: "02:00"
window_days: 7
max_papers: 50
max_news: 50

# The order in each list is the execution order. The workflow runs one profile
# at a time, so the Monday three-item group and all two-item groups are queued
# strictly in the order shown below.
week:
  monday:
    - arenaviridae
    - hantavirus
    - mpox-virus
  tuesday:
    - sfts-virus
    - sars-cov-2
  wednesday:
    - nipah-virus
    - ebola-virus
  thursday:
    - norovirus
    - chikungunya-virus
  friday:
    - influenza-virus
    - rhinovirus
  saturday:
    - parainfluenza-virus
    - enterovirus
  sunday:
    - respiratory-syncytial-virus
    - human-metapneumovirus
