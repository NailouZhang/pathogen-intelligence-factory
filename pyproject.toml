[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathogen-intelligence-factory"
version = "14.4.0"
description = "Weekly pathogen intelligence with recent-first editorial synthesis, exclusive evidence-role analysis, static plus Playwright news extraction, free translation fallback, GitHub Pages and WeChat publishing."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
