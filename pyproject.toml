[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathogen-intelligence-factory"
version = "17.1.0"
description = "Evidence-preserving pathogen literature and news intelligence with frozen five-term retrieval, post-dedup completion, primary and supplementary reporting, bilingual GitHub Pages and WeChat publishing."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
