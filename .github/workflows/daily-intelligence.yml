name: Weekly 21-Virus Intelligence Cycle v16.1

on:
  schedule:
    # 18:00 UTC = 02:00 Asia/Shanghai on the next calendar day.
    # The resolver uses the actual Asia/Shanghai weekday, avoiding UTC weekday drift.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      profile_id:
        description: Optional single profile ID; keeps backward compatibility with the previous workflow
        required: false
        default: ""
        type: string
      profiles:
        description: Optional comma-separated profile IDs, executed in the written order
        required: false
        default: ""
        type: string
      run_mode:
        description: scheduled uses the weekday list; all runs all 21 profiles
        required: false
        default: scheduled
        type: choice
        options: [scheduled, all]
      refresh_profile:
        description: Rebuild the frozen runtime profile from authoritative sources
        required: false
        default: false
        type: boolean
      refresh_review_vocabulary:
        description: Force one atomic rebuild of all downstream review/topic vocabularies
        required: false
        default: false
        type: boolean
      cover_image_mode:
        description: auto, gemini, deterministic
        required: false
        default: auto
        type: choice
        options: [auto, gemini, deterministic]
      dispatch_wechat:
        description: Trigger the private WeChat publisher after each successful profile
        required: false
        default: true
        type: boolean
      review_mode:
        description: balanced uses Python for all candidates and LLM only for ambiguous records; all_compact is an optional audit mode
        required: false
        default: balanced
        type: choice
        options: [balanced, all_compact]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-21-virus-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      pages_ready: ${{ steps.portal.outputs.pages_ready }}
    steps:
      - name: Checkout executable code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements.txt

      - name: Install Python build toolchain, dependencies and project
        run: |
          set -Eeuo pipefail
          PIF_PYTHON_BIN=python bash scripts/install_python_project.sh editable

      - name: Install CJK fonts and bounded browser fallback
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          # Install only the headless Chromium shell used by the bounded news
          # fallback. Static requests/Trafilatura extraction still runs first.
          python -m playwright install --with-deps --only-shell chromium

      - name: Resolve today's ordered profile queue
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.run_mode }}
          INPUT_PROFILE: ${{ inputs.profile_id }}
          INPUT_PROFILES: ${{ inputs.profiles }}
        run: |
          set -Eeuo pipefail
          MODE="${INPUT_MODE:-scheduled}"
          [[ "$EVENT_NAME" == schedule ]] && MODE=scheduled
          python scripts/resolve_weekly_schedule.py \
            --mode "$MODE" \
            --profile-id "${INPUT_PROFILE:-}" \
            --profiles "${INPUT_PROFILES:-}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare durable data branch clone
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/pif_data_repo /tmp/pif_runs /tmp/pages_site
          mkdir -p /tmp/pif_runs
          git clone --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/pif_data_repo
          cd /tmp/pif_data_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin intelligence-data >/dev/null 2>&1; then
            git checkout -B intelligence-data origin/intelligence-data
          else
            git checkout --orphan intelligence-data
            git rm -rf . || true
          fi

      - name: Run profiles sequentially and dispatch successful packages
        id: run_cycle
        shell: bash
        env:
          PROFILES_JSON: ${{ steps.plan.outputs.profiles_json }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_BASE_URL: ${{ vars.SILICONFLOW_BASE_URL || 'https://api.siliconflow.cn/v1' }}
          BIGMODEL_BASE_URL: ${{ vars.BIGMODEL_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL || secrets.CROSSREF_MAILTO }}
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME || secrets.RELIEFWEB_APPNAME || 'wiv-virology-literature-tracker-42x' }}
          PUBLISHER_REPO_TOKEN: ${{ secrets.PUBLISHER_REPO_TOKEN }}
          PUBLISHER_REPO: ${{ vars.PUBLISHER_REPO || 'NailouZhang/pathogen-wechat-publisher' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL || 'mistral-small-latest' }}
          SILICONFLOW_MODEL: ${{ vars.SILICONFLOW_MODEL }}
          BIGMODEL_MODEL: ${{ vars.BIGMODEL_MODEL || 'glm-4.7-flash' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
          PIF_USER_AGENT: ${{ vars.PIF_USER_AGENT }}
          PIF_REFRESH_PROFILE: ${{ github.event_name == 'schedule' && 'false' || inputs.refresh_profile || 'false' }}
          PIF_REFRESH_REVIEW_VOCABULARY: ${{ github.event_name == 'schedule' && 'false' || inputs.refresh_review_vocabulary || 'false' }}
          PIF_COVER_IMAGE_MODE: ${{ github.event_name == 'schedule' && vars.PIF_COVER_IMAGE_MODE || inputs.cover_image_mode || vars.PIF_COVER_IMAGE_MODE || 'auto' }}
          PIF_CONTENT_SOURCE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PIF_WINDOW_DAYS: ${{ steps.plan.outputs.window_days }}
          PIF_MAX_PAPERS: ${{ steps.plan.outputs.max_papers }}
          PIF_MAX_NEWS: ${{ steps.plan.outputs.max_news }}
          # Metadata retrieval is not truncated locally. Only five distinct
          # core concepts are sent to each provider. Full text/news bodies are
          # fetched only after relevance review and a bounded replacement queue. Final Top-N selection occurs after content, analysis and translation gates.
          PIF_MAX_PAPER_CANDIDATES: "0"
          PIF_MAX_NEWS_CANDIDATES: "0"
          PIF_MAX_NEWS_FETCHES: "80"
          PIF_MAX_FULLTEXTS: ${{ vars.PIF_MAX_FULLTEXTS || '150' }}
          # News extraction: RSS metadata -> cleaned publisher URL -> static
          # multi-extractor -> bounded Playwright rendering -> source-summary
          # fallback. No CAPTCHA solving, login automation or access bypass.
          PIF_NEWS_BROWSER_ENABLED: ${{ vars.PIF_NEWS_BROWSER_ENABLED || 'true' }}
          PIF_NEWS_BROWSER_MAX_PAGES: ${{ vars.PIF_NEWS_BROWSER_MAX_PAGES || '3' }}
          PIF_NEWS_BROWSER_TIMEOUT_MS: ${{ vars.PIF_NEWS_BROWSER_TIMEOUT_MS || '18000' }}
          PIF_NEWS_STATIC_MAX_URLS: ${{ vars.PIF_NEWS_STATIC_MAX_URLS || '8' }}
          PIF_NEWS_ENRICH_WORKERS: ${{ vars.PIF_NEWS_ENRICH_WORKERS || '4' }}
          PIF_NEWS_EXCERPT_MIN_CHARS: ${{ vars.PIF_NEWS_EXCERPT_MIN_CHARS || '100' }}
          PIF_TRANSLATION_NETWORK_FAILURE_THRESHOLD: ${{ vars.PIF_TRANSLATION_NETWORK_FAILURE_THRESHOLD || '2' }}
          PIF_PUBMED_PER_QUERY: "250"
          PIF_PUBMED_TOTAL_LIMIT: "2000"
          PIF_EUROPE_PMC_PER_QUERY: "250"
          PIF_CROSSREF_PER_QUERY: "80"
          # Indexed/re-indexed timestamps are metadata events, not publication dates.
          PIF_CROSSREF_INCLUDE_INDEXED: "false"
          # Allow bounded future issue/print dates while still requiring a real
          # publication field at the post-retrieval hard gate.
          PIF_PUBLICATION_FUTURE_DAYS: ${{ vars.PIF_PUBLICATION_FUTURE_DAYS || '90' }}
          PIF_SEMANTIC_PER_QUERY: "100"
          # Semantic Scholar is supplementary. Without a key, the five lean
          # plain-text queries run with conservative anonymous pacing.
          PIF_SEMANTIC_ANONYMOUS_QUERY_LIMIT: "5"
          PIF_SEMANTIC_ANONYMOUS_DELAY_MS: "700"
          PIF_OPENALEX_PER_QUERY: "100"
          # The preprint API is a bulk date feed. Bound scanning and filter
          # title/abstract identity before global deduplication.
          PIF_PREPRINT_MAX_RECORDS_PER_SERVER: ${{ vars.PIF_PREPRINT_MAX_RECORDS_PER_SERVER || '300' }}
          PIF_PREPRINT_IDENTITY_FILTER: ${{ vars.PIF_PREPRINT_IDENTITY_FILTER || 'true' }}
          # Python reviews 100% of candidates. Routine balanced mode sends
          # only ambiguous records to the LLM; manual all_compact mode can
          # cross-check every candidate without a document-count cutoff.
          PIF_LLM_REVIEW_MODE: ${{ github.event_name == 'schedule' && vars.PIF_LLM_REVIEW_MODE || inputs.review_mode || vars.PIF_LLM_REVIEW_MODE || 'balanced' }}
          PIF_LLM_COMPACT_BATCH_TOKENS: "12000"
          PIF_LLM_ESCALATION_BATCH_TOKENS: "10000"
          PIF_RELEVANCE_REVIEW_CACHE: "true"
          PIF_ANALYSIS_CACHE: "true"
          # Structured-analysis observability and bounded provider rescue.
          PIF_ANALYSIS_FALLBACK_WARNING_RATIO: ${{ vars.PIF_ANALYSIS_FALLBACK_WARNING_RATIO || '0.20' }}
          PIF_ANALYSIS_FALLBACK_CRITICAL_RATIO: ${{ vars.PIF_ANALYSIS_FALLBACK_CRITICAL_RATIO || '0.50' }}
          PIF_ANALYSIS_REQUIRE_LLM: ${{ vars.PIF_ANALYSIS_REQUIRE_LLM || 'false' }}
          PIF_LLM_MAX_MODELS_PER_PROVIDER: ${{ vars.PIF_LLM_MAX_MODELS_PER_PROVIDER || '2' }}
          PIF_LLM_ATTEMPTS_PER_MODEL: ${{ vars.PIF_LLM_ATTEMPTS_PER_MODEL || '1' }}
          PIF_LLM_MAX_OUTPUT_TOKENS: ${{ vars.PIF_LLM_MAX_OUTPUT_TOKENS || '1400' }}
          PIF_ANALYSIS_MAX_PROMPT_CHARS: ${{ vars.PIF_ANALYSIS_MAX_PROMPT_CHARS || '14000' }}
          PIF_ANALYSIS_EVIDENCE_MAX_CHARS: ${{ vars.PIF_ANALYSIS_EVIDENCE_MAX_CHARS || '9000' }}
          PIF_ANALYSIS_FULLTEXT_TOP_N: ${{ vars.PIF_ANALYSIS_FULLTEXT_TOP_N || '12' }}
          PIF_ANALYSIS_CROSSCHECK_TOP_N: ${{ vars.PIF_ANALYSIS_CROSSCHECK_TOP_N || '5' }}
          PIF_LLM_CACHE_SUCCESS_ONLY: ${{ vars.PIF_LLM_CACHE_SUCCESS_ONLY || 'true' }}
          PIF_LLM_DISABLE_THINKING: ${{ vars.PIF_LLM_DISABLE_THINKING || 'true' }}
          PIF_LLM_PROVIDER_COOLDOWN_SECONDS: ${{ vars.PIF_LLM_PROVIDER_COOLDOWN_SECONDS || '60' }}
          PIF_DEEPSEEK_GRANTED_BALANCE_ONLY: ${{ vars.PIF_DEEPSEEK_GRANTED_BALANCE_ONLY || 'true' }}
          PIF_DEEPSEEK_MIN_GRANTED_BALANCE: ${{ vars.PIF_DEEPSEEK_MIN_GRANTED_BALANCE || '0.10' }}
          # Shared across all sequential profiles in this workflow and persisted
          # on intelligence-data so later pathogens do not retry exhausted quotas.
          PIF_PROVIDER_STATE_FILE: /tmp/pif_data_repo/shared/state/provider_quota_daily.json
          PIF_LLM_EXTRACT_PROVIDER_ORDER: ${{ vars.PIF_LLM_EXTRACT_PROVIDER_ORDER || 'gemini,bigmodel,siliconflow,mistral,deepseek,openrouter,groq' }}
          PIF_LLM_RESCUE_PROVIDER_ORDER: ${{ vars.PIF_LLM_RESCUE_PROVIDER_ORDER || 'gemini,deepseek,bigmodel,mistral,siliconflow,openrouter,groq' }}
          PIF_LLM_OVERVIEW_PROVIDER_ORDER: ${{ vars.PIF_LLM_OVERVIEW_PROVIDER_ORDER || 'gemini,deepseek,bigmodel,mistral,siliconflow,openrouter,groq' }}
          PIF_LLM_RELEVANCE_PROVIDER_ORDER: ${{ vars.PIF_LLM_RELEVANCE_PROVIDER_ORDER || 'gemini,bigmodel,siliconflow,mistral,deepseek,openrouter,groq' }}
          PIF_TRANSLATION_PROVIDER_ORDER: ${{ vars.PIF_TRANSLATION_PROVIDER_ORDER || 'gemini,bigmodel,mistral,siliconflow,deepseek,openrouter,groq' }}
          PIF_LLM_ALLOW_PAID: ${{ vars.PIF_LLM_ALLOW_PAID || 'false' }}
          PIF_OPENROUTER_FREE_ONLY: ${{ vars.PIF_OPENROUTER_FREE_ONLY || 'true' }}
          PIF_OPENROUTER_HTTP_REFERER: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PIF_OPENROUTER_APP_TITLE: Pathogen Intelligence Factory
          PIF_NEWS_CONTEXT_QUERY_LIMIT: "0"
          PIF_NEWS_EVENT_QUERY_LIMIT: ${{ vars.PIF_NEWS_EVENT_QUERY_LIMIT || '4' }}
          PIF_SCARCE_NEWS_PROFILES: ${{ vars.PIF_SCARCE_NEWS_PROFILES || 'marburg_virus,nipah_virus,ebola_viruses,arenaviridae,sftsv' }}
          PIF_REJECT_PUBLICATION_TYPES: ${{ vars.PIF_REJECT_PUBLICATION_TYPES || 'dataset,data set,component,grant,supplementary material,supplement' }}
          PIF_REJECT_REPOSITORY_HOSTS: ${{ vars.PIF_REJECT_REPOSITORY_HOSTS || 'figshare.com,zenodo.org,dryad.org,datadryad.org' }}
          PIF_OVERVIEW_MIN_ITEMS: "15"
          PIF_OVERVIEW_MAX_ITEMS: "25"
          PIF_WECHAT_NEWS_MAX_ZH_CHARS: "500"
          PIF_NEWS_BRIEF_MIN_SOURCE_CHARS: ${{ vars.PIF_NEWS_BRIEF_MIN_SOURCE_CHARS || '500' }}
          PIF_MAX_SUPPLEMENTARY_NEWS: ${{ vars.PIF_MAX_SUPPLEMENTARY_NEWS || '100' }}
          PIF_WECHAT_MAX_VISIBLE_CHARS: ${{ vars.PIF_WECHAT_MAX_VISIBLE_CHARS || '48000' }}
          PIF_WECHAT_MIN_FULL_PAPERS: ${{ vars.PIF_WECHAT_MIN_FULL_PAPERS || '10' }}
          PIF_WECHAT_REMOVE_SUPPLEMENTARY_NEWS_EXCERPTS: ${{ vars.PIF_WECHAT_REMOVE_SUPPLEMENTARY_NEWS_EXCERPTS || 'true' }}
          PIF_WECHAT_ALLOW_SUPPLEMENTARY_PAPER_OMISSION: ${{ vars.PIF_WECHAT_ALLOW_SUPPLEMENTARY_PAPER_OMISSION || 'true' }}
          PIF_WECHAT_MIN_SUPPLEMENTARY_PAPERS: ${{ vars.PIF_WECHAT_MIN_SUPPLEMENTARY_PAPERS || '0' }}
          PIF_WECHAT_ALLOW_SUPPLEMENTARY_NEWS_OMISSION: ${{ vars.PIF_WECHAT_ALLOW_SUPPLEMENTARY_NEWS_OMISSION || 'true' }}
          PIF_WECHAT_MIN_SUPPLEMENTARY_NEWS: ${{ vars.PIF_WECHAT_MIN_SUPPLEMENTARY_NEWS || '0' }}
          PIF_WECHAT_ALLOW_MAIN_NEWS_OMISSION: ${{ vars.PIF_WECHAT_ALLOW_MAIN_NEWS_OMISSION || 'true' }}
          PIF_WECHAT_MIN_MAIN_NEWS: ${{ vars.PIF_WECHAT_MIN_MAIN_NEWS || '10' }}
          PIF_WECHAT_ALLOW_PRIMARY_PAPER_OMISSION: ${{ vars.PIF_WECHAT_ALLOW_PRIMARY_PAPER_OMISSION || 'true' }}
          PIF_WECHAT_MIN_PRIMARY_PAPERS: ${{ vars.PIF_WECHAT_MIN_PRIMARY_PAPERS || '10' }}
          PIF_WECHAT_TITLE_MAX_CHARS: ${{ vars.PIF_WECHAT_TITLE_MAX_CHARS || '220' }}
          PIF_WECHAT_AUTHORS_MAX_CHARS: ${{ vars.PIF_WECHAT_AUTHORS_MAX_CHARS || '300' }}
          PIF_WECHAT_PAPER_ABSTRACT_MAX_CHARS: ${{ vars.PIF_WECHAT_PAPER_ABSTRACT_MAX_CHARS || '500' }}
          PIF_WECHAT_PAPER_ELEMENT_MAX_CHARS: ${{ vars.PIF_WECHAT_PAPER_ELEMENT_MAX_CHARS || '120' }}
          PIF_WECHAT_NEWS_ELEMENT_MAX_CHARS: ${{ vars.PIF_WECHAT_NEWS_ELEMENT_MAX_CHARS || '100' }}
          PIF_WECHAT_OVERVIEW_MAX_CHARS: ${{ vars.PIF_WECHAT_OVERVIEW_MAX_CHARS || '1200' }}
          PIF_DISPLAY_CANDIDATE_BUFFER: ${{ vars.PIF_DISPLAY_CANDIDATE_BUFFER || '100' }}
          PIF_MAX_SUPPLEMENTARY_PAPERS: ${{ vars.PIF_MAX_SUPPLEMENTARY_PAPERS || '100' }}
          PIF_FULLTEXT_BATCH_SIZE: ${{ vars.PIF_FULLTEXT_BATCH_SIZE || '25' }}
          PIF_HTTP_TIMEOUT: "18"
          PIF_HTTP_RETRIES: "2"
          PIF_LLM_HTTP_TIMEOUT: "55"
          PIF_PROFILE_RUNTIME_MINUTES: ${{ vars.PIF_PROFILE_RUNTIME_MINUTES || '150' }}
          PIF_FINALIZATION_RESERVE_MINUTES: ${{ vars.PIF_FINALIZATION_RESERVE_MINUTES || '30' }}
          PIF_RETRIEVAL_MAX_MINUTES: ${{ vars.PIF_RETRIEVAL_MAX_MINUTES || '15' }}
          PIF_RELEVANCE_MAX_MINUTES: ${{ vars.PIF_RELEVANCE_MAX_MINUTES || '25' }}
          PIF_PAPER_PROCESSING_MAX_MINUTES: ${{ vars.PIF_PAPER_PROCESSING_MAX_MINUTES || '90' }}
          PIF_SUPPLEMENTARY_REVIEW_MAX_MINUTES: ${{ vars.PIF_SUPPLEMENTARY_REVIEW_MAX_MINUTES || '5' }}
          PIF_NEWS_ENRICHMENT_MAX_MINUTES: ${{ vars.PIF_NEWS_ENRICHMENT_MAX_MINUTES || '10' }}
          PIF_NEWS_ANALYSIS_MAX_MINUTES: ${{ vars.PIF_NEWS_ANALYSIS_MAX_MINUTES || '30' }}
          PIF_PAPER_ANALYSIS_ATTEMPT_MULTIPLIER: ${{ vars.PIF_PAPER_ANALYSIS_ATTEMPT_MULTIPLIER || '1.5' }}
          PYTHONUNBUFFERED: "1"
          SHOULD_DISPATCH: ${{ github.event_name == 'schedule' || inputs.dispatch_wechat }}
        run: |
          set -Eeuo pipefail
          LLM_PREFLIGHT="/tmp/pif_llm_preflight.json"
          set +e
          python scripts/check_credentials.py \
            --analysis-only \
            --probe-llm \
            --json-out "$LLM_PREFLIGHT"
          LLM_PREFLIGHT_STATUS=$?
          set -e
          export PIF_LLM_PREFLIGHT_FILE="$LLM_PREFLIGHT"
          if [[ $LLM_PREFLIGHT_STATUS -ne 0 ]]; then
            echo "::warning title=LLM preflight failed::No configured LLM provider passed the minimal JSON probe. Structured analysis may use low-confidence fallback."
            if [[ "${PIF_ANALYSIS_REQUIRE_LLM:-false}" == "true" ]]; then
              echo "::error::PIF_ANALYSIS_REQUIRE_LLM=true and no LLM provider passed preflight."
              exit 3
            fi
          fi

          mapfile -t PROFILES < <(python -c 'import json,os; print("\n".join(json.loads(os.environ["PROFILES_JSON"])))')
          printf 'Ordered queue: %s\n' "${PROFILES[*]}"
          mkdir -p /tmp/pif_data_repo/shared/state
          : > /tmp/pif_cycle_results.tsv

          for PROFILE_ID in "${PROFILES[@]}"; do
            echo "::group::Profile $PROFILE_ID"
            OUT="/tmp/pif_runs/$PROFILE_ID"
            rm -rf "$OUT"
            mkdir -p "$OUT/data/state"

            PREVIOUS="/tmp/pif_data_repo/profiles/$PROFILE_ID/data"
            if [[ -d "$PREVIOUS" ]]; then
              rsync -a "$PREVIOUS/" "$OUT/data/"
              mkdir -p "$OUT/data/state"
            fi

            set +e
            PROFILE_MINUTES="${PIF_PROFILE_RUNTIME_MINUTES:-150}"
            echo "[workflow] starting $PROFILE_ID with ${PROFILE_MINUTES}m profile timeout"
            PIF_CONTENT_SOURCE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/profiles/$PROFILE_ID/" \
            timeout --signal=TERM --kill-after=30s "${PROFILE_MINUTES}m" \
            python -u scripts/run_daily.py \
              --profile "$PROFILE_ID" \
              --output-dir "$OUT" \
              --state-dir "$OUT/data/state" \
              2>&1 | tee "/tmp/${PROFILE_ID}.combined.log"
            STATUS=${PIPESTATUS[0]}
            set -e
            if [[ $STATUS -ne 0 ]]; then
              tail -n 300 "/tmp/${PROFILE_ID}.combined.log" >&2 || true
              mkdir -p "$OUT/data/audit"
              python scripts/classify_profile_failure.py \
                --log "/tmp/${PROFILE_ID}.combined.log" \
                --output-dir "$OUT" \
                --exit-status "$STATUS" \
                --json-out "$OUT/data/audit/profile_failure_classification.json" || true
              FAILURE_CLASS="$(python -c 'import json,sys; p=sys.argv[1]; print(json.load(open(p,encoding="utf-8")).get("classification","unknown_failure"))' "$OUT/data/audit/profile_failure_classification.json" 2>/dev/null || echo unknown_failure)"
              printf '%s\tfailed:%s\t%s\n' "$PROFILE_ID" "$FAILURE_CLASS" "$STATUS" >> /tmp/pif_cycle_results.tsv
              echo "::error::Profile $PROFILE_ID failed ($FAILURE_CLASS); continuing with the next queued profile."
              echo "::endgroup::"
              continue
            fi

            python scripts/validate_wechat_package.py "$OUT/wechat-package"
            python scripts/audit_rendered_html.py \
              "$OUT/site/index.html" \
              --json-out "$OUT/data/audit/rendered_html_quality.json"
            python scripts/issue_summary.py "$OUT/data/latest.json" --github-summary "$GITHUB_STEP_SUMMARY"
            ISSUE_DATE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["issue_date"])' "$OUT/data/latest.json")"

            BASE="/tmp/pif_data_repo/profiles/$PROFILE_ID"
            mkdir -p "$BASE/data" "$BASE/site" "$BASE/wechat-package"
            rsync -a --delete "$OUT/data/" "$BASE/data/"
            rsync -a --delete "$OUT/site/" "$BASE/site/"
            rsync -a --delete "$OUT/wechat-package/" "$BASE/wechat-package/"

            cd /tmp/pif_data_repo
            git add -A "profiles/$PROFILE_ID" "shared/state"
            if git diff --cached --quiet; then
              DATA_SHA="$(git rev-parse HEAD)"
            else
              git commit -m "chore: publish $PROFILE_ID intelligence $ISSUE_DATE"
              git push origin HEAD:intelligence-data
              DATA_SHA="$(git rev-parse HEAD)"
            fi
            cd "$GITHUB_WORKSPACE"

            PACKAGE_PATH="profiles/$PROFILE_ID/wechat-package"
            if [[ "$SHOULD_DISPATCH" == true ]]; then
              if [[ -z "$PUBLISHER_REPO_TOKEN" ]]; then
                echo "::warning::PUBLISHER_REPO_TOKEN is empty; skipping WeChat dispatch for $PROFILE_ID"
              else
                SOURCE_REPO="$GITHUB_REPOSITORY" SOURCE_SHA="$DATA_SHA" PACKAGE_PATH="$PACKAGE_PATH" PROFILE_ID="$PROFILE_ID" ISSUE_DATE="$ISSUE_DATE" \
                python -c 'import json,os; print(json.dumps({"event_type":"wechat-package-ready","client_payload":{"source_repo":os.environ["SOURCE_REPO"],"source_sha":os.environ["SOURCE_SHA"],"package_path":os.environ["PACKAGE_PATH"],"profile_id":os.environ["PROFILE_ID"],"publish_key":os.environ["PROFILE_ID"]+":"+os.environ["ISSUE_DATE"],"force":False,"refresh_cover":False}},ensure_ascii=False))' \
                  >/tmp/dispatch.json
                # WeChat is a downstream independent repository. A dispatch
                # failure must never roll back the already-published data or
                # prevent GitHub Pages from being built for this profile.
                if curl --fail-with-body --silent --show-error \
                  -X POST \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $PUBLISHER_REPO_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/$PUBLISHER_REPO/dispatches" \
                  --data-binary @/tmp/dispatch.json; then
                  echo "WeChat dispatch accepted for $PROFILE_ID at $DATA_SHA"
                else
                  DISPATCH_STATUS=$?
                  echo "::warning title=WeChat dispatch failed::$PROFILE_ID was published to intelligence-data, but the private publisher dispatch failed with exit $DISPATCH_STATUS. Pages generation will continue."
                fi
              fi
            fi

            printf '%s\tsuccess\t%s\t%s\n' "$PROFILE_ID" "$ISSUE_DATE" "$DATA_SHA" >> /tmp/pif_cycle_results.tsv
            echo "::endgroup::"
          done

          python scripts/recommend_weekly_schedule.py \
            --data-root /tmp/pif_data_repo \
            --json-out /tmp/pif_schedule_recommendation.json || true

          {
            echo '### Weekly 21-virus cycle'
            echo
            echo "Schedule reason: ${{ steps.plan.outputs.reason }}"
            echo
            echo '| Profile | Status | Issue/exit | Commit |'
            echo '|---|---|---|---|'
            awk -F '\t' '{printf "| `%s` | %s | %s | `%s` |\n",$1,$2,$3,$4}' /tmp/pif_cycle_results.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build multi-profile Pages portal
        id: portal
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/build_portal.py \
            --data-root /tmp/pif_data_repo \
            --output /tmp/pages_site
          test -s /tmp/pages_site/index.html
          echo "pages_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: weekly21-virus-cycle-${{ github.run_number }}
          path: |
            /tmp/pif_runs
            /tmp/pif_cycle_results.tsv
            /tmp/pif_schedule_recommendation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/pages_site

  deploy-pages:
    needs: cycle
    if: ${{ needs.cycle.outputs.pages_ready == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
