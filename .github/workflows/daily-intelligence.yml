name: Daily Pathogen Intelligence Factory

on:
  schedule:
    # 22:00 UTC = 06:00 Asia/Shanghai on the next calendar day
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      profile_id:
        description: profiles/<profile_id>/seed.yaml
        required: true
        default: hantavirus
      refresh_profile:
        description: Rebuild the strict terminology profile from authoritative sources
        required: false
        default: false
        type: boolean
      cover_image_mode:
        description: auto, gemini, deterministic
        required: false
        default: auto
        type: choice
        options: [auto, gemini, deterministic]
      dispatch_wechat:
        description: Trigger the private WeChat publisher after a successful build
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pathogen-intelligence-${{ inputs.profile_id || vars.PIF_PROFILE_ID || 'hantavirus' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      profile_id: ${{ steps.vars.outputs.profile_id }}
      issue_date: ${{ steps.verify.outputs.issue_date }}
      data_sha: ${{ steps.persist.outputs.data_sha }}
      package_path: ${{ steps.persist.outputs.package_path }}
    steps:
      - name: Checkout executable code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve profile and Pages URL
        id: vars
        shell: bash
        env:
          INPUT_PROFILE: ${{ inputs.profile_id }}
          DEFAULT_PROFILE: ${{ vars.PIF_PROFILE_ID }}
          CONFIGURED_PAGES_URL: ${{ vars.PIF_CONTENT_SOURCE_URL }}
        run: |
          set -Eeuo pipefail
          PROFILE_ID="${INPUT_PROFILE:-${DEFAULT_PROFILE:-hantavirus}}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER="${OWNER,,}"
          PAGES_URL="${CONFIGURED_PAGES_URL:-https://${OWNER_LOWER}.github.io/${REPO}/}"
          echo "profile_id=$PROFILE_ID" >> "$GITHUB_OUTPUT"
          echo "pages_url=$PAGES_URL" >> "$GITHUB_OUTPUT"

      - name: Restore profile-specific durable data
        shell: bash
        env:
          PROFILE_ID: ${{ steps.vars.outputs.profile_id }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/pif_previous /tmp/pif_out
          mkdir -p /tmp/pif_previous /tmp/pif_out/data
          if git ls-remote --exit-code --heads origin intelligence-data >/dev/null 2>&1; then
            git fetch origin intelligence-data:refs/remotes/origin/intelligence-data
            git archive origin/intelligence-data "profiles/$PROFILE_ID/data" 2>/dev/null | tar -x -C /tmp/pif_previous || true
            if [[ -d "/tmp/pif_previous/profiles/$PROFILE_ID/data" ]]; then
              rsync -a "/tmp/pif_previous/profiles/$PROFILE_ID/data/" /tmp/pif_out/data/
            fi
          fi

      - name: Collect, analyse, translate and render
        env:
          PROFILE_ID: ${{ steps.vars.outputs.profile_id }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
          PIF_USER_AGENT: ${{ vars.PIF_USER_AGENT }}
          PIF_REFRESH_PROFILE: ${{ inputs.refresh_profile || 'false' }}
          PIF_COVER_IMAGE_MODE: ${{ inputs.cover_image_mode || vars.PIF_COVER_IMAGE_MODE || 'auto' }}
          PIF_CONTENT_SOURCE_URL: ${{ steps.vars.outputs.pages_url }}
        run: |
          python scripts/run_daily.py \
            --profile "$PROFILE_ID" \
            --output-dir /tmp/pif_out \
            --state-dir /tmp/pif_out/data/state

      - name: Verify all contracts
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s /tmp/pif_out/data/latest.json
          test -s /tmp/pif_out/site/index.html
          test -s /tmp/pif_out/site/feed.xml
          test -s /tmp/pif_out/site/assets/cover.jpg
          test -s /tmp/pif_out/wechat-package/manifest.json
          test -s /tmp/pif_out/wechat-package/article.html
          test -s /tmp/pif_out/wechat-package/cover.jpg
          python scripts/validate_wechat_package.py /tmp/pif_out/wechat-package
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          issue = json.loads(Path('/tmp/pif_out/data/latest.json').read_text(encoding='utf-8'))
          print('issue_date=' + issue['issue_date'])
          PY

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: pathogen-intelligence-${{ steps.vars.outputs.profile_id }}-${{ steps.verify.outputs.issue_date }}-${{ github.run_number }}
          path: /tmp/pif_out
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/pif_out/site

      - name: Persist immutable profile outputs
        id: persist
        shell: bash
        env:
          PROFILE_ID: ${{ steps.vars.outputs.profile_id }}
          ISSUE_DATE: ${{ steps.verify.outputs.issue_date }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin intelligence-data >/dev/null 2>&1; then
            git switch --force-create intelligence-data origin/intelligence-data
          else
            git switch --orphan intelligence-data
            git rm -rf . || true
          fi

          BASE="profiles/$PROFILE_ID"
          mkdir -p "$BASE/data" "$BASE/site" "$BASE/wechat-package"
          rsync -a --delete /tmp/pif_out/data/ "$BASE/data/"
          rsync -a --delete /tmp/pif_out/site/ "$BASE/site/"
          rsync -a --delete /tmp/pif_out/wechat-package/ "$BASE/wechat-package/"

          # Keep the latest executed profile at the branch root for convenient inspection.
          rsync -a --delete /tmp/pif_out/site/ site/
          printf '%s\n' "$PROFILE_ID" > latest_profile.txt

          git add -A profiles site latest_profile.txt
          if git diff --cached --quiet; then
            echo "No intelligence changes to commit." >&2
            DATA_SHA="$(git rev-parse HEAD)"
          else
            git commit -m "chore: publish $PROFILE_ID intelligence $ISSUE_DATE"
            git push origin HEAD:intelligence-data
            DATA_SHA="$(git rev-parse HEAD)"
          fi
          echo "data_sha=$DATA_SHA" >> "$GITHUB_OUTPUT"
          echo "package_path=$BASE/wechat-package" >> "$GITHUB_OUTPUT"

      - name: Trigger private WeChat publisher
        if: ${{ github.event_name == 'schedule' || inputs.dispatch_wechat }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PUBLISHER_REPO_TOKEN }}
          PUBLISHER_REPO: ${{ vars.PUBLISHER_REPO || 'NailouZhang/pathogen-wechat-publisher' }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.persist.outputs.data_sha }}
          PACKAGE_PATH: ${{ steps.persist.outputs.package_path }}
          PROFILE_ID: ${{ steps.vars.outputs.profile_id }}
          ISSUE_DATE: ${{ steps.verify.outputs.issue_date }}
        run: |
          set -Eeuo pipefail
          python - <<'PY' >/tmp/dispatch.json
          import json, os
          print(json.dumps({
            "event_type": "wechat-package-ready",
            "client_payload": {
              "source_repo": os.environ["SOURCE_REPO"],
              "source_sha": os.environ["SOURCE_SHA"],
              "package_path": os.environ["PACKAGE_PATH"],
              "profile_id": os.environ["PROFILE_ID"],
              "publish_key": f"{os.environ['PROFILE_ID']}:{os.environ['ISSUE_DATE']}",
              "force": False
            }
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$PUBLISHER_REPO/dispatches" \
            --data-binary @/tmp/dispatch.json

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
