manual_query_skeletons:
  pubmed_high_precision: (("Lassa virus"[Title/Abstract] OR "lymphocytic choriomeningitis virus"[Title/Abstract] OR "Junín
    virus"[Title/Abstract] OR "Junin virus"[Title/Abstract] OR "Machupo virus"[Title/Abstract] OR "Guanarito virus"[Title/Abstract]
    OR "Sabiá virus"[Title/Abstract] OR "Sabia virus"[Title/Abstract] OR "Chapare virus"[Title/Abstract] OR "Lujo virus"[Title/Abstract]
    OR ("mammarenavirus"[Title/Abstract] AND (human[Title/Abstract] OR hemorrhagic[Title/Abstract]))) AND {{DATE_FILTER}})
    NOT (Reptarenavirus[Title/Abstract] OR Hartmanivirus[Title/Abstract] OR Antennavirus[Title/Abstract])
  news_high_precision: ("Lassa virus" OR "Lassa fever" OR "lymphocytic choriomeningitis virus" OR "Junin virus" OR "Machupo
    virus" OR "Guanarito virus" OR "Chapare virus" OR "Lujo virus") AND (outbreak OR case OR infection OR transmission OR
    surveillance)
