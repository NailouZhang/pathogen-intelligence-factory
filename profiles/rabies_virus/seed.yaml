  - Lyssavirus rabies
  disease_identity_terms:
  - rabies
  - rabies encephalitis
  - human rabies
  context_terms:
  - animal bite
  - saliva exposure
  - dog-mediated rabies
  - bat rabies
  - post-exposure prophylaxis
  - pre-exposure prophylaxis
  - rabies immunoglobulin
  - mass dog vaccination
  - One Health
  display_only_terms:
