manual_query_skeletons:
  pubmed_high_precision: (("Ebola virus"[Title/Abstract] OR "Ebola virus disease"[Title/Abstract] OR "Sudan virus"[Title/Abstract]
    OR "Bundibugyo virus"[Title/Abstract] OR "Taï Forest virus"[Title/Abstract] OR "Reston virus"[Title/Abstract] OR "Bombali
    virus"[Title/Abstract]) AND {{DATE_FILTER}}) NOT ("Marburg virus"[Title/Abstract])
  news_high_precision: ("Ebola virus" OR "Ebola virus disease" OR "Sudan virus" OR "Bundibugyo virus") AND (outbreak OR case
    OR transmission OR vaccine OR treatment)
authoritative_sources:
- name: ViralZone Filoviridae
