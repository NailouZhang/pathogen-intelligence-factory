manual_query_skeletons:
  pubmed_high_precision: (("hantavirus"[Title/Abstract] OR "orthohantavirus"[Title/Abstract] OR "Hantaan virus"[Title/Abstract]
    OR "Seoul virus"[Title/Abstract] OR "Puumala virus"[Title/Abstract] OR "Sin Nombre virus"[Title/Abstract] OR "Andes virus"[Title/Abstract])
    AND {{DATE_FILTER}})
  news_high_precision: ("hantavirus" OR "Hantaan virus" OR "Seoul virus" OR "Puumala virus" OR "Sin Nombre virus" OR "Andes
    virus") AND (outbreak OR case OR infection OR rodent OR surveillance)
authoritative_sources:
- name: ICTV Hantaviridae
  organization: ICTV
  url: https://ictv.global/report/chapter/hantaviridae/hantaviridae
  role: taxonomy
  required: false
- name: ICTV Orthohantavirus
  organization: ICTV
  url: https://ictv.global/report/chapter/hantaviridae/hantaviridae/mammantavirinae/orthohantavirus
  role: taxonomy
  required: false
- name: ViralZone Orthohantavirus
  organization: ViralZone
  url: https://viralzone.expasy.org/213
  role: molecular
  required: false
- name: CDC About Hantavirus
  organization: CDC
  url: https://www.cdc.gov/hantavirus/about/index.html
  role: public_health
  required: false
source_policy:
  exact_urls_only: true
  allow_search_discovery: false
  allow_llm_memory_completion: false
  minimum_usable_sources: 1
  cache_on_success: true
  use_cache_on_fetch_failure: true
query_policy:
  date_filter_injected_by_program: true
  pubmed_max_chars: 1800
  news_max_chars: 350
  reject_unanchored_or_branches: true
  reject_context_only_hits: true
  minimum_relevance_score: 6
  review_score_min: 3
  candidate_relevance_score: 3
  keep_review_until_enrichment: true
  llm_review_medium_confidence: true
news_identity_terms_zh:
- 汉坦病毒
- 汉坦病毒感染
- 肾综合征出血热
- 汉坦病毒肺综合征
retrieval_policy:
  execute_all_query_chunks: true
  pubmed_per_query: 120
  europe_pmc_per_query: 150
  crossref_per_term: 50
  semantic_scholar_per_term: 80
  openalex_per_term: 80
  candidate_gate: accept_or_review
  final_gate: accept_after_content_enrichment
