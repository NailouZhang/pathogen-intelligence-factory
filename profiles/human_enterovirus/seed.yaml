manual_query_skeletons:
  pubmed_high_precision: (("non-polio enterovirus"[Title/Abstract] OR "nonpolio enterovirus"[Title/Abstract] OR "EV-A71"[Title/Abstract]
    OR "enterovirus A71"[Title/Abstract] OR "EV-D68"[Title/Abstract] OR "enterovirus D68"[Title/Abstract] OR "coxsackievirus
    A6"[Title/Abstract] OR "coxsackievirus A16"[Title/Abstract]) AND {{DATE_FILTER}}) NOT (poliovirus[Title/Abstract] OR porcine
    enterovirus[Title/Abstract])
  news_high_precision: ("non-polio enterovirus" OR "EV-A71" OR "EV-D68" OR "coxsackievirus A6" OR "coxsackievirus A16") AND
    (outbreak OR cases OR surveillance OR "hand foot and mouth disease" OR "acute flaccid myelitis")
